[project]
name = "astribot-async-deploy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "msgpack>=1.0.0",
    "numpy>=1.22.4,<2.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
